<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mini-feedly</title>
<base target="_top">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #05070a;
    color: #e6edf3;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  .topbar {
    background: #0d1117;
    border-bottom: 1px solid #1f2732;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: #3fb950;
    text-transform: uppercase;
  }
  .refresh-btn {
    background: none;
    border: 1px solid #1f2732;
    color: #8b949e;
    font-size: 12px;
    font-family: 'Courier New', Consolas, monospace;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .refresh-btn:hover { color: #e6edf3; border-color: #3fb950; }

  .layout {
    display: flex;
    max-width: 1100px;
    margin: 0 auto;
    min-height: calc(100vh - 57px);
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    border-right: 1px solid #1f2732;
    padding: 20px 0;
  }
  .kw-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 24px;
    cursor: pointer;
    font-size: 14px;
    color: #8b949e;
    border-left: 3px solid transparent;
  }
  .kw-item:hover { color: #e6edf3; }
  .kw-item.active {
    color: #e6edf3;
    background: #111820;
    border-left-color: #3fb950;
  }
  .kw-count {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 11px;
    color: #5b6472;
  }

  .main { flex: 1; min-width: 0; padding: 28px 32px; }
  .main-header { margin-bottom: 18px; }
  .main-title {
    font-size: 22px;
    font-weight: 700;
    color: #e6edf3;
  }
  .main-sub {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 12px;
    color: #8b949e;
    margin-top: 4px;
  }
  .search-input {
    display: block;
    width: 100%;
    max-width: 320px;
    background: #111820;
    border: 1px solid #1f2732;
    color: #e6edf3;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    margin-top: 12px;
  }
  .search-input::placeholder { color: #5b6472; }
  .search-input:focus { outline: none; border-color: #3fb950; }

  .article-card {
    background: #111820;
    border-left: 3px solid #3fb950;
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .article-meta {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 11px;
    color: #3fb950;
    letter-spacing: 1px;
  }
  .article-title {
    font-size: 16px;
    font-weight: 700;
    color: #f0f6fc;
    margin-top: 6px;
    line-height: 1.4;
  }
  .article-link {
    display: block;
    font-size: 13px;
    color: #58a6ff;
    text-decoration: none;
    margin-top: 8px;
    word-break: break-all;
  }
  .article-link:hover { text-decoration: underline; }
  .article-date {
    font-family: 'Courier New', Consolas, monospace;
    font-size: 11px;
    color: #5b6472;
    margin-top: 8px;
  }

  .empty-state {
    color: #8b949e;
    font-size: 14px;
    padding: 20px 0;
  }

  .see-more-btn {
    display: block;
    width: 100%;
    background: #111820;
    border: 1px solid #1f2732;
    color: #8b949e;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 4px;
  }
  .see-more-btn:hover { color: #e6edf3; border-color: #3fb950; }
  .see-more-btn:disabled { cursor: default; opacity: 0.6; }
</style>
</head>
<body>

  <div class="topbar">
    <span class="brand">● mini-feedly // Live Feed</span>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="empty-state">Loading keywords…</div>
    </div>
    <div class="main">
      <div class="main-header" id="mainHeader"></div>
      <div id="articleList">
        <div class="empty-state">Loading articles…</div>
      </div>
    </div>
  </div>

<script>
  var PAGE_SIZE = 20;

  var keywordsData = { keywords: [], counts: {} };
  var activeKeyword = null;
  var currentArticles = [];
  var currentOffset = 0;
  var hasMore = false;
  var loadingMore = false;
  var searchQuery = "";

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function displayUrl(url) {
    return escapeHtml(String(url || "").replace(/^https?:\/\//, ""));
  }

  function renderSidebar() {
    var sidebar = document.getElementById("sidebar");
    if (keywordsData.keywords.length === 0) {
      sidebar.innerHTML = '<div class="empty-state" style="padding:0 24px;">No keywords tracked yet.</div>';
      return;
    }
    sidebar.innerHTML = keywordsData.keywords.map(function (kw) {
      var count = keywordsData.counts[kw] || 0;
      return (
        '<div class="kw-item' + (kw === activeKeyword ? " active" : "") + '" data-keyword="' + escapeHtml(kw) + '">' +
          '<span>' + escapeHtml(kw) + "</span>" +
          '<span class="kw-count">' + count + "</span>" +
        "</div>"
      );
    }).join("");
  }

  function filterArticles(articles, query) {
    if (!query) return articles;
    var q = query.toLowerCase();
    return articles.filter(function (a) {
      return (a.title || "").toLowerCase().indexOf(q) !== -1 ||
        (a.source || "").toLowerCase().indexOf(q) !== -1;
    });
  }

  // Rebuilds the title/count/search-box block. Only called on keyword
  // switch or initial load - never on a search keystroke, so the input
  // itself is never re-created (which would drop focus/cursor position).
  function renderHeader() {
    var totalCount = keywordsData.counts[activeKeyword] || 0;
    document.getElementById("mainHeader").innerHTML =
      '<div class="main-title">' + escapeHtml(activeKeyword || "") + "</div>" +
      '<div class="main-sub">' + totalCount + " article(s) tracked · newest first</div>" +
      '<input type="text" id="searchInput" class="search-input" ' +
        'placeholder="Filter loaded articles by title or source…" value="' + escapeHtml(searchQuery) + '">';
  }

  // Rebuilds just the article cards + See More button, filtered by
  // searchQuery. Safe to call on every keystroke.
  function renderArticleList() {
    var container = document.getElementById("articleList");

    if (currentArticles.length === 0) {
      container.innerHTML = '<div class="empty-state">No articles tracked for this keyword yet - check back after tomorrow\'s 9am run.</div>';
      return;
    }

    var filtered = filterArticles(currentArticles, searchQuery);
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state">No loaded articles match "' + escapeHtml(searchQuery) + '".</div>';
      return;
    }

    var cardsHtml = filtered.map(function (a) {
      return (
        '<div class="article-card">' +
          '<div class="article-meta">' + escapeHtml((a.source || "UNKNOWN SOURCE").toUpperCase()) + "</div>" +
          '<div class="article-title">' + escapeHtml(a.title) + "</div>" +
          '<a class="article-link" href="' + escapeHtml(a.url) + '" target="_blank" rel="noopener">' + displayUrl(a.url) + "</a>" +
          '<div class="article-date">First tracked ' + escapeHtml(a.firstSeen) + "</div>" +
        "</div>"
      );
    }).join("");

    var seeMoreHtml = hasMore
      ? '<button class="see-more-btn" id="seeMoreBtn"' + (loadingMore ? " disabled" : "") + '>' +
        (loadingMore ? "Loading…" : "See More") + "</button>"
      : "";

    container.innerHTML = cardsHtml + seeMoreHtml;
  }

  function loadNextPage() {
    if (loadingMore || !activeKeyword) return;
    loadingMore = true;
    renderArticleList();
    google.script.run
      .withSuccessHandler(function (data) {
        loadingMore = false;
        currentArticles = currentArticles.concat(data.items);
        currentOffset += data.items.length;
        hasMore = data.hasMore;
        renderArticleList();
      })
      .withFailureHandler(function (err) {
        console.error(err);
        loadingMore = false;
        renderArticleList();
      })
      .getArticlesPage(activeKeyword, currentOffset, PAGE_SIZE);
  }

  function loadFirstPage() {
    currentArticles = [];
    currentOffset = 0;
    hasMore = false;
    searchQuery = "";
    renderHeader();
    document.getElementById("articleList").innerHTML = '<div class="empty-state">Loading articles…</div>';
    loadNextPage();
  }

  function loadKeywords() {
    document.getElementById("sidebar").innerHTML = '<div class="empty-state" style="padding:0 24px;">Loading keywords…</div>';
    document.getElementById("articleList").innerHTML = '<div class="empty-state">Loading articles…</div>';
    google.script.run
      .withSuccessHandler(function (data) {
        keywordsData = data || { keywords: [], counts: {} };
        if (!activeKeyword || keywordsData.keywords.indexOf(activeKeyword) === -1) {
          activeKeyword = keywordsData.keywords[0] || null;
        }
        renderSidebar();
        if (activeKeyword) loadFirstPage();
      })
      .withFailureHandler(function (err) {
        console.error(err);
        document.getElementById("articleList").innerHTML = '<div class="empty-state">Failed to load - check the Apps Script execution log.</div>';
      })
      .getKeywordCounts();
  }

  document.getElementById("sidebar").addEventListener("click", function (e) {
    var el = e.target.closest(".kw-item");
    if (!el || el.getAttribute("data-keyword") === activeKeyword) return;
    activeKeyword = el.getAttribute("data-keyword");
    renderSidebar();
    loadFirstPage();
  });

  document.getElementById("mainHeader").addEventListener("input", function (e) {
    if (e.target.id !== "searchInput") return;
    searchQuery = e.target.value;
    renderArticleList();
  });

  document.getElementById("articleList").addEventListener("click", function (e) {
    if (e.target.id === "seeMoreBtn") loadNextPage();
  });

  document.getElementById("refreshBtn").addEventListener("click", loadKeywords);

  loadKeywords();
</script>

</body>
</html>
